<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<title>Document</title>
</head>
<body class="container">
	<h1>Git demo</h1>
	<hr>
	<input class="form-control mb-2" type="number" id="param-a" placeholder="Parameter A">
	<input class="form-control mb-2" type="number" id="param-b" placeholder="Parameter B">
	<button class="btn btn-sm btn-primary" onclick="addition()">Add numbers</button>
	<button class="btn btn-sm btn-primary" onclick="subtraction()">Sub numbers</button>
	<button class="btn btn-sm btn-warning" onclick="multiplication()">Sub numbers</button>
	<button class="btn btn-sm btn-warning" onclick="division()">Sub numbers</button>
	<!-- HÁZI FELADAT:
			- a mostani feladatot továbbcsinálni a következők mentén
			-- legyen egy ADD gomb -> két szám összeadása, result-ba eredmény kiírása
			-- legyen egy SUB gomb -> két szám kivonása, result-ba eredmény kiírása
			-- legyen egy MUL gomb -> két szám szorzása, result-ba eredmény kiírása
			-- legyen egy DIV gomb -> két szám osztása, result-ba eredmény kiírása
			---- osztásnál a nullával való osztásra figyeljünk, ha ilyen van, akkor result-ba hibaüzenet menjen (pirossal!)
	-->
	<h4 id="result"></h4>
	<script src="calc.js"></script>
	<script src="app.js"></script>
</body>
</html>
